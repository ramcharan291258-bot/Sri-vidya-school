<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b4ea2" />
    <meta name="description" content="Sri Vidya E.M. School, established in 2002 at Kesavaram, West Godavari, offers English Medium education from LKG to 7th Class." />
    <title>Sri Vidya E.M. School | Kesavaram</title>
    <script>
      /* Production image compatibility: supplied images live at repository root. */
      (() => {
        const RAW = 'https://raw.githubusercontent.com/ramcharan291258-bot/Sri-vidya-school/main/';
        const IMAGE_EXT = /\.(?:png|jpe?g|webp|gif|svg|avif)$/i;
        const normalize = (value) => {
          if (!value || typeof value !== 'string') return value;
          if (/^(?:https?:|data:|blob:|\/\/)/i.test(value)) return value;
          let path = value;
          if (path.startsWith('/images/')) path = path.slice('/images/'.length);
          else if (path.startsWith('images/')) path = path.slice('images/'.length);
          else if (path.startsWith('/')) path = path.slice(1);
          if (!IMAGE_EXT.test(path)) return value;
          if (path === 'principal-designed.png') return RAW + 'event-portrait.jpeg';
          if (path === 'staff-group.png') return RAW + 'event-group-1.jpeg';
          return RAW + path;
        };
        const fix = (img) => {
          if (!img || !img.getAttribute) return;
          const raw = img.getAttribute('src');
          const next = normalize(raw);
          if (next && next !== raw) img.setAttribute('src', next);
        };
        const originalSetAttribute = Element.prototype.setAttribute;
        Element.prototype.setAttribute = function(name, value) {
          if (this instanceof HTMLImageElement && String(name).toLowerCase() === 'src') value = normalize(value);
          return originalSetAttribute.call(this, name, value);
        };
        const descriptor = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
        if (descriptor?.set) {
          Object.defineProperty(HTMLImageElement.prototype, 'src', {
            configurable: descriptor.configurable, enumerable: descriptor.enumerable,
            get: descriptor.get, set(value) { descriptor.set.call(this, normalize(value)); }
          });
        }
        const fixAll = () => document.querySelectorAll('img').forEach(fix);
        new MutationObserver(fixAll).observe(document.documentElement, {subtree:true,childList:true,attributes:true,attributeFilter:['src']});
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fixAll); else fixAll();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
