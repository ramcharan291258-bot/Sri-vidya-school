<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b4ea2" />
    <meta name="description" content="Sri Vidya E.M. School, established in 2002 at Kesavaram, West Godavari, offers English Medium education from LKG to 7th Class." />
    <title>Sri Vidya E.M. School | Kesavaram</title>
    <script>
      /* Keep all supplied production images same-origin. The repository stores them at root. */
      (() => {
        const map = {
          'principal-designed.png': '/event-portrait.jpeg',
          'staff-group.png': '/event-group-1.jpeg',
          'campus-original.jpeg': '/campus-original.jpeg',
          'event-group-1.jpeg': '/event-group-1.jpeg',
          'event-group-2.jpeg': '/event-group-2.jpeg',
          'event-portrait.jpeg': '/event-portrait.jpeg',
          'event-celebration.png': '/event-celebration.png',
          'hero-campus.png': '/hero-campus.png',
          'logo.png': '/logo.png'
        };
        const normalize = (value) => {
          if (!value || typeof value !== 'string') return value;
          if (/^(?:https?:|data:|blob:|\/\/)/i.test(value)) {
            try {
              const u = new URL(value, location.origin);
              const name = u.pathname.split('/').pop();
              if (map[name]) return map[name];
            } catch (_) {}
            return value;
          }
          const name = value.split('?')[0].split('/').pop();
          return map[name] || value.replace(/^\/images\//, '/').replace(/^images\//, '/');
        };
        const fixImages = () => document.querySelectorAll('img').forEach(img => {
          const next = normalize(img.getAttribute('src'));
          if (next && next !== img.getAttribute('src')) img.setAttribute('src', next);
        });
        const fixHero = () => {
          const hero = document.querySelector('.hero');
          if (hero) {
            const current = getComputedStyle(hero).backgroundImage || '';
            if (!current.includes('hero-campus.png')) {
              hero.style.backgroundImage = "linear-gradient(90deg,rgba(4,27,67,.9),rgba(4,27,67,.52),rgba(4,27,67,.1)),url('/hero-campus.png')";
              hero.style.backgroundSize = 'cover';
              hero.style.backgroundPosition = 'center';
            }
          }
        };
        const fix = () => { fixImages(); fixHero(); };
        const originalSetAttribute = Element.prototype.setAttribute;
        Element.prototype.setAttribute = function(name, value) {
          if (this instanceof HTMLImageElement && String(name).toLowerCase() === 'src') value = normalize(value);
          return originalSetAttribute.call(this, name, value);
        };
        const descriptor = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
        if (descriptor?.set) Object.defineProperty(HTMLImageElement.prototype, 'src', {
          configurable: descriptor.configurable, enumerable: descriptor.enumerable,
          get: descriptor.get, set(value) { descriptor.set.call(this, normalize(value)); }
        });
        new MutationObserver(fix).observe(document.documentElement, {subtree:true,childList:true,attributes:true,attributeFilter:['src','style']});
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fix); else fix();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
