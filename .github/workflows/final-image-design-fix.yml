name: Final image design fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-images:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch image mappings and crop
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('main.jsx')
          s = p.read_text(encoding='utf-8')

          images = {
            'Smart Classrooms':'https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=1000&q=85',
            'Computer Lab':'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1000&q=85',
            'Science Lab':'https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=1000&q=85',
            'Mathematics Lab':'https://images.unsplash.com/photo-1509228468518-180dd4864904?auto=format&fit=crop&w=1000&q=85',
            'Library':'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=1000&q=85',
            'Playground':'https://images.unsplash.com/photo-1526634332515-d56c0f7f2d07?auto=format&fit=crop&w=1000&q=85',
            'Indoor Games':'https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1000&q=85',
            'Auditorium':'https://images.unsplash.com/photo-1503095396549-807759245b35?auto=format&fit=crop&w=1000&q=85',
            'Transport':'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=1000&q=85',
            'CCTV Security':'https://images.unsplash.com/photo-1557597774-9d273605dfa9?auto=format&fit=crop&w=1000&q=85',
            'RO Drinking Water':'https://images.unsplash.com/photo-1548839140-29a749e1cf4d?auto=format&fit=crop&w=1000&q=85',
            'Canteen':'https://images.unsplash.com/photo-1556740749-887f6717d7e4?auto=format&fit=crop&w=1000&q=85',
            'Medical Room':'https://images.unsplash.com/photo-1584982751601-97dcc096659c?auto=format&fit=crop&w=1000&q=85',
            'Activity Rooms':'https://images.unsplash.com/photo-1503676382389-4809596d5290?auto=format&fit=crop&w=1000&q=85',
            'Music / Dance':'https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=1000&q=85',
            'Other Facilities':'https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1000&q=85',
            'Sports':'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=1000&q=85',
            'Cultural Programs':'https://images.unsplash.com/photo-1503095396549-807759245b35?auto=format&fit=crop&w=1000&q=85',
            'Annual Day':'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1000&q=85',
            'Sports Day':'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=1000&q=85',
            'Science Exhibition':'https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=1000&q=85',
            'Educational Tours':'https://images.unsplash.com/photo-1503220317375-aaad61436b1b?auto=format&fit=crop&w=1000&q=85',
            'Yoga':'https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=1000&q=85',
            'Dance':'https://images.unsplash.com/photo-1547153760-18fc86324498?auto=format&fit=crop&w=1000&q=85',
            'Music':'https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=1000&q=85',
            'Drawing':'https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1000&q=85',
            'Clubs':'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1000&q=85',
            'Celebrations':'https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=1000&q=85',
          }

          for title, url in images.items():
            pattern = r"(\['" + re.escape(title) + r"'[^\n]*?['\"])(/images/items/[^'\"]+)(['\"])"
            s = re.sub(pattern, lambda m: m.group(1)+url+m.group(3), s, count=1)

          # Keep the AI-redesigned principal photo as the only principal asset.
          s = s.replace("/images/principal-original.png", "/images/principal-designed.png")
          s = s.replace("/images/principal.jpg", "/images/principal-designed.png")

          p.write_text(s, encoding='utf-8')

          css = Path('styles.css')
          c = css.read_text(encoding='utf-8')
          c += "\n/* Final visual image polish */\n.principal-photo{background:#eef4fb;display:flex;align-items:center;justify-content:center;min-height:520px}.principal-photo img{width:100%;height:100%;min-height:520px;aspect-ratio:auto;object-fit:contain;object-position:center center;background:#eef4fb}.visual-art{background:#eef4fb!important}.visual-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.visual-art .art-overlay{z-index:1}.visual-art .icon-box,.visual-art>span{z-index:2}\n"
          css.write_text(c, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.jsx styles.css
          git diff --cached --quiet || git commit -m "Apply realistic section images and principal crop fix [skip ci]"
          git push
