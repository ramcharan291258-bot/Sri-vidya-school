<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b4ea2"><meta name="apple-mobile-web-app-capable" content="yes"><title>Sri Vidya E.M. School App</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f8ff;color:#102b4e}.wrap{max-width:760px;margin:auto;padding:18px 14px 90px}.top{background:#fff;border-bottom:1px solid #dfe8f3;position:sticky;top:0;z-index:5;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.brand img{width:42px;height:42px;object-fit:contain;border-radius:10px}.brand b,.brand small{display:block}.brand b{font-size:14px}.brand small{font-size:11px;color:#71849b}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800}.blue{background:#0b4ea2;color:white}.light{background:#eaf3ff;color:#0b4ea2}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#fff;border:1px solid #dfe8f3;border-radius:22px;padding:22px;box-shadow:0 15px 50px #123b6818;width:min(430px,100%)}label{display:block;font-size:12px;font-weight:800;margin:12px 0}input,textarea,select{width:100%;padding:12px;border:1px solid #d6e1ed;border-radius:11px;margin-top:6px;background:#fbfdff}textarea{min-height:90px}.switch{display:flex;gap:6px;margin:15px 0}.switch button{flex:1;border:1px solid #d6e1ed;background:white;padding:10px;border-radius:10px}.switch .on{background:#0b4ea2;color:white}.hero{background:linear-gradient(135deg,#0b4ea2,#0a77ce);color:white;border-radius:20px;padding:20px;margin:15px 0}.hero h1{margin:4px 0;font-size:24px}.hero p{margin:3px 0;opacity:.82}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{border:1px solid #dce6f0;background:#fff;border-radius:13px;padding:12px 6px;min-height:65px;font-weight:800;color:#526981}.grid button.on{background:#eaf3ff;color:#0b4ea2;border-color:#8eb9e8}.panel{background:#fff;border:1px solid #dfe8f3;border-radius:18px;padding:16px;margin:14px 0}.panel h3{margin:0 0 12px}.item{padding:12px;background:#f7faff;border-left:3px solid #0b78d0;border-radius:10px;margin:8px 0}.item b{display:block}.item small{color:#788ba2;font-size:11px}.item p{font-size:13px;color:#60738a;margin:6px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dfe8f3;padding:9px;display:flex;justify-content:center;gap:8px;z-index:10}.bottom button{border:0;background:transparent;padding:8px 18px;color:#60748d;font-weight:800}.bottom .on{color:#0b4ea2}.err{background:#fff0f0;color:#a5221b;padding:10px;border-radius:10px;margin-top:10px;font-size:12px}.ok{background:#e8f7ee;color:#167345;padding:10px;border-radius:10px;margin-top:10px;font-size:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}} </style></head><body><div id="root"></div><script>
const root=document.getElementById('root');let lang='en',mode='parent',token=sessionStorage.getItem('sv-app-token'),session=null,data=null,tab='announcements';const T={en:{school:'Sri Vidya E.M. School',parent:'Parent App',admin:'Admin App',login:'Login',sid:'Student ID',pin:'Parent PIN',user:'Admin Username',pass:'Password',dash:'Dashboard',announce:'Announcements',homework:'Homework',attendance:'Attendance',timetable:'Timetable',results:'Results',fees:'Fees',holidays:'Holidays',circulars:'Circulars',events:'Events',achievements:'Achievements',transport:'Transport',leave:'Leave Request',complaints:'Complaints',gallery:'Gallery',save:'Publish Update',send:'Send',title:'Title',date:'Date',desc:'Description',welcome:'Welcome'},te:{school:'శ్రీ విద్యా ఇ.ఎం. స్కూల్',parent:'తల్లిదండ్రుల యాప్',admin:'అడ్మిన్ యాప్',login:'లాగిన్',sid:'విద్యార్థి ID',pin:'పేరెంట్ PIN',user:'అడ్మిన్ యూజర్‌నేమ్',pass:'పాస్‌వర్డ్',dash:'డ్యాష్‌బోర్డ్',announce:'ప్రకటనలు',homework:'హోమ్‌వర్క్',attendance:'హాజరు',timetable:'టైమ్‌టేబుల్',results:'ఫలితాలు',fees:'ఫీజులు',holidays:'సెలవులు',circulars:'సర్క్యులర్లు',events:'కార్యక్రమాలు',achievements:'విద్యార్థి విజయాలు',transport:'రవాణా',leave:'సెలవు అభ్యర్థన',complaints:'ఫిర్యాదులు',gallery:'గ్యాలరీ',save:'అప్‌డేట్ ప్రచురించండి',send:'పంపండి',title:'శీర్షిక',date:'తేదీ',desc:'వివరణ',welcome:'స్వాగతం'}};const modules=['announcements','homework','attendance','timetable','results','fees','holidays','circulars','events','achievements','transport','gallery'];const t=()=>T[lang];async function api(method,body){const r=await fetch('/api/app',{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}function login(){root.innerHTML='<div class="login"><div class="card"><div class="brand"><img src="/images/logo.png"><div><b>'+t().school+'</b><small>'+t().parent+'</small></div></div><div class="switch"><button class="'+(mode==='parent'?'on':'')+'" onclick="mode=\'parent\';login()">'+(lang==='en'?'Parent Login':'పేరెంట్ లాగిన్')+'</button><button class="'+(mode==='admin'?'on':'')+'" onclick="mode=\'admin\';login()">'+(lang==='en'?'Admin Login':'అడ్మిన్ లాగిన్')+'</button></div><div class="switch"><button class="'+(lang==='en'?'on':'')+'" onclick="lang=\'en\';login()">English</button><button class="'+(lang==='te'?'on':'')+'" onclick="lang=\'te\';login()">తెలుగు</button></div><form onsubmit="doLogin(event)">'+(mode==='parent'?'<label>'+t().sid+'<input id="sid" placeholder="SV001" required></label><label>'+t().pin+'<input id="pin" type="password" placeholder="1234" required></label>':'<label>'+t().user+'<input id="user" required></label><label>'+t().pass+'<input id="pass" type="password" required></label>')+'<button class="btn blue" style="width:100%;margin-top:10px">'+t().login+'</button></form><div id="msg"></div></div></div>'}async function doLogin(e){e.preventDefault();const msg=document.getElementById('msg');try{const j=await api('POST',mode==='admin'?{role:'admin',username:user.value,password:pass.value}:{role:'parent',studentId:sid.value,pin:pin.value});token=j.token;sessionStorage.setItem('sv-app-token',token);session=j;await load()}catch(x){msg.className='err';msg.textContent=x.message}}async function load(){try{const j=await api('GET');session=j;data=j.data;render()}catch(e){sessionStorage.removeItem('sv-app-token');token=null;login()}}function render(){const admin=session.role==='admin';root.innerHTML='<div class="top"><div class="brand"><img src="/images/logo.png"><div><b>'+t().school+'</b><small>'+ (admin?t().admin:t().parent)+'</small></div></div><div><button class="btn light" onclick="lang=lang===\'en\'?\'te\':\'en\';render()">'+(lang==='en'?'తె':'EN')+'</button> <button class="btn light" onclick="logout()">↪</button></div></div><main class="wrap">'+(admin?adminView():parentView())+'</main><div class="bottom"><button class="on" onclick="tab=\'announcements\';render()">⌂ '+t().dash+'</button><button onclick="window.location.href=\'https://wa.me/919491171564\'">WhatsApp</button><button onclick="logout()">Logout</button></div>'}function parentView(){const p=session.profile||{};return '<section class="hero"><div>'+t().welcome+', '+(p.name||'Parent')+'</div><h1>'+(p.studentName||'Student')+'</h1><p>'+(p.className||'')+' • '+(p.studentId||'')+'</p></section><div class="grid">'+modules.map(m=>'<button class="'+(tab===m?'on':'')+'" onclick="tab=\''+m+'\';render()">'+t()[m]+'</button>').join('')+'</div>'+list(tab,data?.[tab])+'<section class="panel"><h3>'+t().leave+'</h3><textarea id="leave" placeholder="'+t().desc+'"></textarea><button class="btn blue" onclick="sendRequest(\'leaves\')">'+t().send+'</button></section><section class="panel"><h3>'+t().complaints+'</h3><textarea id="complaint" placeholder="'+t().desc+'"></textarea><button class="btn blue" onclick="sendRequest(\'complaints\')">'+t().send+'</button></section>'}function adminView(){return '<section class="hero"><div>CONTROL CENTER</div><h1>'+t().admin+'</h1><p>Live school updates for parent accounts.</p></section><div class="grid">'+modules.filter(x=>x!=='gallery').map(m=>'<button class="'+(tab===m?'on':'')+'" onclick="tab=\''+m+'\';render()">'+t()[m]+'</button>').join('')+'</div><section class="panel"><h3>'+t().save+': '+t()[tab]+'</h3><input id="title" placeholder="'+t().title+'"><input id="date" type="date" value="'+new Date().toISOString().slice(0,10)+'"><textarea id="desc" placeholder="'+t().desc+'"></textarea><button class="btn blue" onclick="publish()">'+t().save+'</button><div id="msg"></div></section>'+list(tab,data?.[tab])+'<section class="panel"><h3>Parent Accounts</h3>'+(data.accounts||[]).map(a=>'<div class="item"><b>'+a.studentName+'</b><small>'+a.studentId+' • '+a.className+'</small><p>'+a.name+'</p></div>').join('')+'</section>'}function list(key,items){if(!items?.length)return '<section class="panel"><h3>'+t()[key]+'</h3><p style="color:#8797aa">No updates yet</p></section>';return '<section class="panel"><h3>'+t()[key]+'</h3>'+items.map(x=>'<div class="item"><b>'+esc(x.title||x.subject||x.name||x.date||'Update')+'</b>'+(x.date?'<small>'+esc(x.date)+'</small>':'')+'<p>'+esc(x.description||x.message||x.text||'')+'</p>'+(x.status?'<small>'+esc(x.status)+'</small>':'')+'</div>').join('')+'</section>'}async function publish(){const next={...data};next[tab]=[...(data[tab]||[]),{title:title.value,date:date.value,description:desc.value}];try{data=await api('PUT',next);data=data;render()}catch(e){msg.className='err';msg.textContent=e.message}}async function sendRequest(key){const el=document.getElementById(key==='leaves'?'leave':'complaint');if(!el.value)return;const next={...data,[key]:[...(data[key]||[]),{studentId:session.profile.studentId,message:el.value,status:'pending',date:new Date().toISOString().slice(0,10)}]};try{data=await api('PUT',next);render()}catch(e){alert(e.message)}}function logout(){sessionStorage.removeItem('sv-app-token');token=null;session=null;login()}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}if(token)load();else login();
</script></body></html>
